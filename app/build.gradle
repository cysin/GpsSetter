plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def tagName = '0.1.0'

android {
    namespace 'com.cysindex.telequant'
    // YukiHookAPI 1.3.2 (and its BetterAndroid transitives) require compiling
    // against API 37+. targetSdk stays at 36 so runtime behavior is unchanged.
    compileSdk 37

    defaultConfig {
        applicationId "com.cysindex.telequant"
        minSdk 30
        targetSdk 36
        versionCode 1401
        versionName tagName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")

        /*
         * MapLibre ships native renderers for four ABIs, which would add ~20 MB.
         * This module needs Android 11+ with Magisk/KernelSU and Zygisk, and in
         * practice every such device is arm64. Dropping the rest keeps the APK
         * reasonable; add them back here if 32-bit support is ever needed.
         */
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    /*
     * Signing credentials come from Gradle properties, normally set in the
     * user's ~/.gradle/gradle.properties, so no keystore path or password ever
     * reaches this repository. Without them the release variant still builds,
     * just unsigned — a clone stays buildable for anyone.
     */
    signingConfigs {
        release {
            def storePath = project.findProperty('TELEQUANT_STORE_FILE')
            if (storePath && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword project.findProperty('TELEQUANT_STORE_PASSWORD')
                keyAlias project.findProperty('TELEQUANT_KEY_ALIAS')
                keyPassword project.findProperty('TELEQUANT_KEY_PASSWORD')

                // v1 is unnecessary at minSdk 30 and slows installation. v3
                // carries the key-rotation record, so the signing key can be
                // replaced later without orphaning existing installs.
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            // R8 is deliberately off. The framework locates this module through
            // the class named in assets/xposed_init, and the hooks reach hidden
            // platform methods (ScanRecord.parseFromBytes, WifiSsid.fromBytes)
            // by reflection — obfuscation breaks both, silently.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def storePath = project.findProperty('TELEQUANT_STORE_FILE')
            if (storePath && file(storePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Room
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // HiddenApiBypass — needed to build/inspect hidden framework types (CellInfo, ScanRecord).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // Xposed (legacy API — what Vector and YukiHookAPI speak)
    compileOnly 'de.robv.android.xposed:api:82'

    // YukiHookAPI. KavaRef (which backs its reflection layer) arrives transitively
    // pinned by yukihookapi's own kavaref-bom. Do NOT declare KavaRef explicitly:
    // 1.1.0 drags in kotlin-stdlib 2.4.0, whose metadata AGP's built-in Kotlin
    // compiler cannot read, breaking the whole build.
    implementation 'com.highcapable.yukihookapi:api:1.3.2'
    ksp 'com.highcapable.yukihookapi:ksp-xposed:1.3.2'

    implementation('dev.rikka.rikkax.material:material-preference:2.0.0') {
        exclude group: 'dev.rikka.rikkax.appcompat', module: 'appcompat'
    }

    /*
     * MapLibre Native replaces osmdroid, which was archived in November 2024.
     * The same renderer draws online and offline, so a downloaded region looks
     * identical to the live map — two separate pipelines never could.
     *
     * Pinned explicitly: the Maven "release" marker currently points at
     * 13.6.1-pre0, a pre-release, so anything resolving "latest" gets that.
     */
    implementation 'org.maplibre.gl:android-sdk:13.6.1'

    // Geocoding against Nominatim; the platform Geocoder needs Play Services.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // The environment model serialises on org.json, which is only a stub
    // in the unit-test android.jar. This provides the real thing.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
