plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def tagName = '0.0.3'

android {
    namespace 'com.cysindex.telequant'
    // YukiHookAPI 1.3.2 (and its BetterAndroid transitives) require compiling
    // against API 37+. targetSdk stays at 36 so runtime behavior is unchanged.
    compileSdk 37

    defaultConfig {
        applicationId "com.cysindex.telequant"
        minSdk 30
        targetSdk 36
        versionCode 1400
        versionName tagName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Room
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // HiddenApiBypass — needed to build/inspect hidden framework types (CellInfo, ScanRecord).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // Xposed (legacy API — what Vector and YukiHookAPI speak)
    compileOnly 'de.robv.android.xposed:api:82'

    // YukiHookAPI. KavaRef (which backs its reflection layer) arrives transitively
    // pinned by yukihookapi's own kavaref-bom. Do NOT declare KavaRef explicitly:
    // 1.1.0 drags in kotlin-stdlib 2.4.0, whose metadata AGP's built-in Kotlin
    // compiler cannot read, breaking the whole build.
    implementation 'com.highcapable.yukihookapi:api:1.3.2'
    ksp 'com.highcapable.yukihookapi:ksp-xposed:1.3.2'

    implementation('dev.rikka.rikkax.material:material-preference:2.0.0') {
        exclude group: 'dev.rikka.rikkax.appcompat', module: 'appcompat'
    }

    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // The library has no tags or releases, so pin the JitPack build to a commit
    // instead of the floating ':master' the project used before.
    implementation 'com.github.controlwear:virtual-joystick-android:fda1c916b6'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
