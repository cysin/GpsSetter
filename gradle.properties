# Project-wide Gradle settings.
# For more details visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

android.useAndroidX=true
kotlin.code.style=official

# Each library's R class contains only its own resources.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true

# AGP 9 notes:
#  - android.enableJetifier was removed (the project is AndroidX-only).
#  - android.nonFinalResIds was removed; R fields are non-final, so R ids
#    cannot be used in `when`/switch branches (see MapActivity nav handling).
#  - Kotlin is built into AGP, so the org.jetbrains.kotlin.android plugin is gone.
